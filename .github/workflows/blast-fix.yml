# Enables the /blast-fix PR comment trigger, which runs Splint (also from
# https://github.com/Pragadhesh/Blast) to propose a corrected version of
# whatever Blast flagged as broken. Requires the same secrets and
# self-hosted runner as blast-scan.yml.
#
# NOTE: if a PR ever comes from a fork, GITHUB_TOKEN won't have push access
# when triggered from that fork's PR -- a GitHub platform restriction on
# comment-triggered workflows, not something this file can work around.

name: Splint

on:
  issue_comment:
    types: [created]

jobs:
  splint:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/blast-fix')
    uses: Pragadhesh/Blast/.github/workflows/blast-fix.yml@main
    with:
      runs_on: self-hosted
    secrets: inherit
