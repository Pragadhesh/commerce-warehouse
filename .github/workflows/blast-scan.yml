# Runs Blast against any changed file in a PR to this repo -- SQL, DDL,
# Terraform, anything an LLM can read (see Blast's docs/architecture.md).
# Blast's actual code lives in https://github.com/Pragadhesh/Blast -- this
# file just wires it up. Entity resolution is DataHub search, no config
# needed in this repo. Requires OPENAI_API_KEY, DATAHUB_SERVER,
# DATAHUB_TOKEN as repository secrets (Settings -> Secrets and variables ->
# Actions), and a self-hosted runner registered on this repo (DataHub runs
# on localhost, which GitHub-hosted runners can't reach).

name: Blast

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  blast:
    permissions:
      contents: read
      pull-requests: write
    uses: Pragadhesh/Blast/.github/workflows/blast-scan.yml@master
    with:
      runs_on: self-hosted
    secrets: inherit
