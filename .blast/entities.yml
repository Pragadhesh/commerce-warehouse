# Tells Blast's entity_resolver.py how to turn a name + platform (extracted
# by its LLM-based change_interpreter -- see Blast's docs/architecture.md)
# into a DataHub URN for this repo. This is the trust boundary: if a
# platform isn't listed here (or the template's wrong), Blast falls back to
# a DataHub search instead of guessing, and skips the file if that doesn't
# find a confident match either -- it never silently makes up a URN.
#
# {name} is whatever change_interpreter extracted as the entity's name.
# {schema} is its best guess at the schema/namespace (raw, public, ...);
# defaults to "public" if it didn't have one.

platforms:
  # Verified live against this repo's DataHub instance this session --
  # covers both the dbt-model-mirrored views (schema=public) and the raw
  # extract tables (schema=raw).
  postgres: "urn:li:dataset:(urn:li:dataPlatform:postgres,commerce_warehouse.{schema}.{name},PROD)"

  # Standard DataHub convention for Kafka (topics are named directly, no
  # schema qualification) -- NOT verified against a live ingestion of this
  # repo's kafka/datahub_ingest.yaml recipe. Confirm before relying on it.
  kafka: "urn:li:dataset:(urn:li:dataPlatform:kafka,{name},PROD)"

  # S3 is a genuinely harder case than the other two: DataHub's s3 source
  # creates one dataset per file-group *within* a bucket
  # (commerce-raw-landing/fiction_retail/{table}), not one dataset for the
  # bucket itself -- so a bucket *rename* doesn't cleanly resolve to a
  # single URN here. This template covers the common case of a change to
  # one specific table's landing path; a full bucket rename needs
  # entity_resolver's DataHub-search fallback (or a person) to work out
  # which of the bucket's per-table datasets are actually affected.
  s3: "urn:li:dataset:(urn:li:dataPlatform:s3,commerce-raw-landing/fiction_retail/{name},PROD)"
